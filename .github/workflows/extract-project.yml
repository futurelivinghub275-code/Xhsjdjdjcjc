name: Extract SANSTUDIOH Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q publish-sanstudioh-android-app-v1.0.0.zip -d extracted
          cp -R extracted/. .
          rm -f AndroidManifest.xml
          rm -f styles.xml
          rm -f publish-sanstudioh-android-app-v1.0.0.zip

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add complete SANSTUDIOH Publish Android project" || echo "Nothing to commit"
          git push
